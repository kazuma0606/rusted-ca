services:
  # Redis Stack (JSON機能付き)
  redis:
    image: redis/redis-stack:latest
    container_name: distributed-redis
    ports:
      - "6379:6379"      # Redis接続ポート
      - "8001:8001"      # RedisInsight (Redis GUI)
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - distributed-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: distributed-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rusted_ca
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - distributed-network

  # phpMyAdmin (MySQL管理ツール)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: distributed-phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=root
      - PMA_ARBITRARY=1
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - distributed-network

  # MongoDB Database (ログ収集用)
  mongodb:
    image: mongo:7.0
    container_name: distributed-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: rusted_ca_logs
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - distributed-network

  # Mongo Express (MongoDB管理ツール)
  mongo-express:
    image: mongo-express:latest
    container_name: distributed-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - distributed-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  distributed-network:
    driver: bridge
    name: distributed-storage-network